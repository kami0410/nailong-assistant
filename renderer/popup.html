<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: file:; media-src 'self' file:; font-src 'self'; connect-src 'none'; form-action 'none'">
<title>奶蛙面板</title>
<link rel="stylesheet" href="ui.css">
<style>
  .head { flex: none; }
  #clock { font-size: 26px; font-weight: 600; letter-spacing: 1px; font-family: var(--mono); line-height: 1.1; }
  #date { font-size: 11px; color: var(--fg-dim); margin-top: 2px; }

  .prog { flex: none; margin-top: 10px; }
  .bar { height: 6px; border-radius: 3px; background: var(--chip); overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width 0.4s var(--ease); }
  .prog-meta { display: flex; align-items: center; margin-top: 5px; font-size: 11px; color: var(--fg-dim); }
  .prog-meta .streak { margin-left: auto; }

  #cdstrip { flex: none; display: flex; gap: 6px; overflow-x: auto; padding: 10px 0 2px; }
  #cdstrip::-webkit-scrollbar { height: 3px; }
  #cdstrip::-webkit-scrollbar-thumb { background: var(--chip-br); border-radius: 2px; }
  .cdchip {
    flex: none; display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 8px;
    border-radius: 12px; background: var(--chip); border: 1px solid var(--chip-br);
    font-size: 11px; color: var(--fg-mid); white-space: nowrap;
  }
  .cdchip b { color: var(--accent); font-weight: 600; }
  .cdchip.today { background: var(--accent); color: var(--accent-fg); border-color: transparent; }
  .cdchip.today b { color: var(--accent-fg); }
  .cdchip.add { cursor: pointer; }
  .cdchip .cdx { opacity: 0.5; cursor: pointer; padding-left: 2px; }
  .cdchip .cdx:hover { opacity: 1; }

  #list { flex: 1; margin-top: 8px; }
  .row-item {
    display: flex; align-items: center; gap: 8px; padding: 7px 9px; border-radius: 12px;
    background: var(--chip); border: 1px solid transparent; margin-bottom: 5px;
  }
  .row-item:hover { background: var(--hover); }
  .row-item.done { opacity: 0.5; }
  .row-item.done .txt { text-decoration: line-through; }
  .row-item.past:not(.done) .time { color: var(--warn); }
  .chk {
    flex: none; width: 18px; height: 18px; line-height: 18px; text-align: center; font-size: 11px;
    border-radius: 50%; border: 1.5px solid var(--chip-br); color: transparent; cursor: pointer;
  }
  .row-item.done .chk { background: var(--ok); color: var(--ok-fg); border-color: transparent; }
  .chk:hover { border-color: var(--accent); }
  .row-item .time { flex: none; font-family: var(--mono); font-size: 11.5px; color: var(--fg-mid); }
  .row-item .txt { flex: 1; min-width: 0; font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row-item .del { flex: none; opacity: 0; cursor: pointer; color: var(--fg-dim); font-size: 11px; padding: 0 3px; }
  .row-item:hover .del { opacity: 1; }
  .row-item .del:hover { color: var(--danger); }
  .row-item .act { flex: none; opacity: 0; cursor: pointer; color: var(--fg-dim); font-size: 11px; padding: 0 3px; }
  .row-item:hover .act { opacity: 1; }
  .row-item .act:hover { color: var(--accent); }

  .quick { flex: none; margin-top: 8px; }
  .quick .row { gap: 6px; }
  #quickPrev { font-size: 10.5px; color: var(--fg-dim); margin-top: 5px; min-height: 14px; }
  #quickPrev b { color: var(--accent); }

  /* 日历 */
  #calGrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; margin-top: 8px; }
  .calcell {
    position: relative; aspect-ratio: 1 / 1; border-radius: 9px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 11.5px; color: var(--fg-mid); background: var(--chip);
  }
  .calcell:hover { background: var(--hover); }
  .calcell.other { opacity: 0.32; }
  .calcell.today { box-shadow: inset 0 0 0 1.5px var(--accent); color: var(--fg); }
  .calcell.sel { background: var(--accent); color: var(--accent-fg); font-weight: 600; }
  .calcell .dots { display: flex; gap: 2px; height: 5px; margin-top: 1px; }
  .calcell .dot { width: 4px; height: 4px; border-radius: 50%; background: var(--warn); }
  .calcell .dot.cd { background: var(--info); }
  .calcell .hol { position: absolute; top: 1px; right: 3px; font-size: 8px; color: var(--danger); }
  .calcell.sel .hol { color: var(--accent-fg); }
  .calhead { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; margin-top: 10px; font-size: 10px; color: var(--fg-dim); text-align: center; }

  /* 添加表单 */
  .fld { margin-bottom: 9px; }
  .fld label { display: block; font-size: 10.5px; color: var(--fg-dim); margin: 0 3px 4px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .chipwrap { display: flex; flex-wrap: wrap; gap: 5px; }

  /* 统计 */
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 4px; }
  .stat {
    padding: 10px; border-radius: 14px; background: var(--chip); border: 1px solid var(--chip-br);
  }
  .stat .v { font-size: 20px; font-weight: 600; font-family: var(--mono); }
  .stat .k { font-size: 10.5px; color: var(--fg-dim); margin-top: 2px; }
  #heat { display: grid; grid-template-columns: repeat(21, 1fr); gap: 2px; margin-top: 8px; }
  #heat i { aspect-ratio: 1 / 1; border-radius: 2px; background: var(--chip); }
  #heat i.l1 { background: color-mix(in srgb, var(--accent-solid) 34%, transparent); }
  #heat i.l2 { background: color-mix(in srgb, var(--accent-solid) 58%, transparent); }
  #heat i.l3 { background: color-mix(in srgb, var(--accent-solid) 80%, transparent); }
  #heat i.l4 { background: var(--accent); }
  .tagline { display: flex; align-items: center; gap: 8px; font-size: 11.5px; margin-top: 6px; }
  .tagline .n { margin-left: auto; color: var(--fg-dim); font-family: var(--mono); }
  .tagbar { flex: 1; height: 5px; border-radius: 3px; background: var(--chip); overflow: hidden; }
  .tagbar > i { display: block; height: 100%; background: var(--accent); }
</style>
</head>
<body class="t0">
  <div class="card">
    <img id="backdrop" class="backdrop" alt="">
    <div class="tint"></div>
    <div class="content">
      <div class="topbar">
        <div class="avatar" id="avatar" data-i18n-title="panel.moveBack"></div>
        <div class="label" data-i18n="panel.title">奶 蛙 面 板</div>
        <div class="icobtn" id="statsbtn" data-i18n-title="panel.stats">📊</div>
        <div class="icobtn" id="themebtn" data-i18n-title="panel.theme">🎨</div>
        <div class="icobtn" id="soundbtn" data-i18n-title="panel.sound">🔊</div>
        <div class="icobtn" id="settingsbtn" data-i18n-title="common.settings">⚙</div>
        <div class="icobtn" id="close" data-i18n-title="common.close">✕</div>
      </div>

      <div class="head">
        <div id="clock">--:--:--</div>
        <div id="date"></div>
      </div>

      <!-- 列表 -->
      <div class="view on" id="v-list">
        <div class="prog">
          <div class="bar"><i id="progFill"></i></div>
          <div class="prog-meta">
            <span id="progText"></span>
            <span class="streak" id="streakText"></span>
          </div>
        </div>
        <div id="cdstrip"></div>
        <div class="row" style="margin-top:8px">
          <div class="sect-title grow" style="margin:0" id="listTitle"></div>
          <div class="icobtn" id="addItemBtn" data-i18n-title="panel.addDetail">＋</div>
          <div class="icobtn" id="openCalBtn" data-i18n-title="panel.calendar">📅</div>
        </div>
        <div class="scroll" id="list"></div>
        <div class="quick">
          <div class="row">
            <input id="quickInput" class="grow" data-i18n-ph="panel.quickAdd" placeholder="说人话就行：明天下午3点评审 #工作">
            <div class="btn primary sm" id="quickAdd" data-i18n="panel.add">添加</div>
          </div>
          <div id="quickPrev"></div>
        </div>
      </div>

      <!-- 日历 -->
      <div class="view" id="v-cal">
        <div class="row" style="margin-top:10px">
          <div class="icobtn" id="prevMonth">‹</div>
          <div class="sect-title grow" style="margin:0;text-align:center" id="calTitle"></div>
          <div class="icobtn" id="nextMonth">›</div>
          <div class="btn sm" id="backListBtn" data-i18n="common.back">返回</div>
        </div>
        <div class="calhead">
          <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
        </div>
        <div id="calGrid"></div>
        <div class="scroll" id="calList" style="margin-top:10px"></div>
      </div>

      <!-- 添加 -->
      <div class="view" id="v-add">
        <div class="row" style="margin-top:10px">
          <div class="sect-title grow" style="margin:0" id="addTitle">添加</div>
          <div class="btn sm" id="cancelAdd" data-i18n="common.cancel">取消</div>
        </div>
        <div class="scroll" style="margin-top:10px">
          <div class="fld">
            <label data-i18n="panel.content">内容</label>
            <input id="addText" placeholder="要做什么？">
          </div>
          <div class="fld">
            <label data-i18n="panel.nlOptional">自然语言（可选，填了就自动解析时间）</label>
            <input id="addNl" placeholder="明天下午3点半 每周一 提前10分钟">
          </div>
          <div class="grid2">
            <div class="fld"><label data-i18n="panel.date">日期</label><input type="date" id="addDate"></div>
            <div class="fld"><label data-i18n="panel.time">时间</label><input type="time" id="addTime"></div>
          </div>
          <div class="fld">
            <label data-i18n="panel.repeat">重复</label>
            <select id="addRepeat">
              <option value="" data-i18n="panel.repeatNone">不重复</option>
              <option value="daily" data-i18n="panel.repeatDaily">每天</option>
              <option value="weekdays" data-i18n="panel.repeatWeekdays">每个工作日</option>
              <option value="weekends" data-i18n="panel.repeatWeekends">每周末</option>
              <option value="weekly" data-i18n="panel.repeatWeekly">每周（同一天）</option>
              <option value="monthly" data-i18n="panel.repeatMonthly">每月（同一号）</option>
              <option value="yearly" data-i18n="panel.repeatYearly">每年</option>
              <option value="every:2d">每 2 天</option>
              <option value="every:3d">每 3 天</option>
              <option value="every:1w">每 1 周</option>
              <option value="every:2w">每 2 周</option>
              <option value="__custom" data-i18n="panel.repeatCustom">自定义…</option>
            </select>
            <input id="addRepeatCustom" placeholder="例如 weekly:1,3,5 或 every:2d" style="margin-top:6px;display:none">
          </div>
          <div class="grid2">
            <div class="fld">
              <label data-i18n="panel.alarm">提前提醒</label>
              <select id="addAlarm">
                <option value="" data-i18n="panel.alarmDefault">默认</option>
                <option value="0" data-i18n="panel.alarmNone">不提醒</option>
                <option value="5">提前 5 分钟</option>
                <option value="10">提前 10 分钟</option>
                <option value="15">提前 15 分钟</option>
                <option value="30">提前 30 分钟</option>
                <option value="60">提前 1 小时</option>
              </select>
            </div>
            <div class="fld">
              <label data-i18n="panel.prio">优先级</label>
              <select id="addPrio">
                <option value="mid" data-i18n="panel.prioMid">普通</option>
                <option value="high" data-i18n="panel.prioHigh">重要 ❗</option>
                <option value="low" data-i18n="panel.prioLow">不急</option>
              </select>
            </div>
          </div>
          <div class="fld">
            <label data-i18n="panel.tag">标签</label>
            <input id="addTag" placeholder="工作 / 生活 / 学习…">
          </div>
        </div>
        <div class="row" style="margin-top:10px">
          <div class="btn primary grow" id="okAdd" data-i18n="panel.save">保存</div>
        </div>
      </div>

      <!-- 统计 -->
      <div class="view" id="v-stats">
        <div class="row" style="margin-top:10px">
          <div class="sect-title grow" style="margin:0" data-i18n="panel.statsTitle">数据统计</div>
          <div class="btn sm" id="backFromStats" data-i18n="common.back">返回</div>
        </div>
        <div class="scroll" style="margin-top:10px">
          <div class="stat-grid" id="statGrid"></div>
          <div class="sect-title" data-i18n="panel.recent21">最近 21 天</div>
          <div id="heat"></div>
          <div class="sect-title" data-i18n="panel.byTag">按标签（近 30 天）</div>
          <div id="tagList"></div>
          <div class="sect-title" data-i18n="panel.aiUsage">AI 用量</div>
          <div id="usageBox" class="small muted"></div>
        </div>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <script src="../src/shared/logic.js"></script>
  <script src="../src/shared/repeat.js"></script>
  <script src="../src/shared/task.js"></script>
  <script src="i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
