<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: file:; media-src 'self' file:; font-src 'self'; connect-src 'none'; form-action 'none'">
<title>奶蛙助手</title>
<link rel="stylesheet" href="ui.css">
<style>
  /* 桌宠气泡：Liquid Glass —— 真实壁纸模糊 + 左上高光 + 1px 边缘折射 */
  #bubble {
    position: absolute; left: 4px; right: 4px; top: 0; max-height: 132px;
    padding: 8px 12px; border-radius: 20px; overflow: hidden;
    background-color: var(--glass-base);
    background-image: var(--glass-fill), var(--glass-tint);
    -webkit-backdrop-filter: blur(22px) saturate(185%);
    backdrop-filter: blur(22px) saturate(185%);
    box-shadow: 0 14px 34px rgba(0, 0, 0, 0.36), 0 2px 6px rgba(0, 0, 0, 0.2),
      inset 0 1px 0 rgba(255, 255, 255, 0.28);
    font-size: 12px; line-height: 1.65; opacity: 0; transform: translateY(5px) scale(0.98);
    transition: opacity 0.24s var(--ease), transform 0.24s var(--ease);
    z-index: 3; cursor: pointer; isolation: isolate;
  }
  #bubble::before {
    content: ''; position: absolute; inset: 0; border-radius: inherit;
    background-image: var(--spec); mix-blend-mode: screen; opacity: 0.85; pointer-events: none;
  }
  #bubble::after {
    content: ''; position: absolute; inset: 0; border-radius: inherit; padding: 1px;
    background-image: var(--rim);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    mask-composite: exclude; pointer-events: none;
  }
  #bubble.show { opacity: 1; transform: translateY(0) scale(1); }
  #bubble > * { position: relative; z-index: 1; }
  #bubble .bi { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #bubble .bi .t { color: var(--fg-dim); font-family: var(--mono); font-size: 11px; margin-right: 6px; }
  #bubble .bi .x { color: var(--fg); }
  #bubble .bi.now .t { color: var(--warn); }
  #bubble .bi.now .x { color: var(--fg); font-weight: 600; }
  #bubble .more { color: var(--fg-dim); font-size: 11px; }
  #bubble .askbtns { display: flex; gap: 6px; margin-top: 6px; }
  #bubble .askbtns .ab {
    flex: 1; height: 25px; line-height: 25px; text-align: center; border-radius: var(--r-pill);
    font-size: 11.5px; cursor: pointer; white-space: nowrap;
    background-color: var(--chip); background-image: linear-gradient(180deg, rgba(255,255,255,0.14), rgba(255,255,255,0.02));
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18), inset 0 0 0 1px var(--chip-br);
    color: var(--fg-mid); transition: background-color 0.16s var(--ease);
  }
  #bubble .askbtns .ab:hover { background-color: var(--hover); color: var(--fg); }
  #bubble .askbtns .yes { background-image: var(--danger-grad); color: var(--danger-fg); box-shadow: inset 0 1px 0 rgba(255,255,255,0.32); font-weight: 600; }
  #bubble .askbtns .go { background-image: var(--accent-grad); color: var(--accent-fg); box-shadow: inset 0 1px 0 rgba(255,255,255,0.42); font-weight: 600; }
  #bubble.drop-hint { background-image: none; background-color: rgba(30, 116, 68, 0.92); }
  #bubble.flash { background-image: none; background-color: var(--danger); animation: flashRed 0.75s infinite; }
  #bubble.flash .bi .x, #bubble.flash .bi .t { color: #fff; }

  #pet {
    position: absolute; left: 50%; bottom: 0; width: 96px; height: 104px;
    margin-left: -48px; z-index: 2; cursor: pointer;
    background-image: url('../assets/naifrog/web-spritesheet.png');
    background-size: 768px 936px; background-repeat: no-repeat; background-position: 0 0;
    filter: drop-shadow(0 6px 10px rgba(0,0,0,0.35));
    will-change: background-position;
  }
  #pet.bounce { animation: bounce 0.5s ease 2; }
  #pet.spin { animation: spin 0.9s linear; }
  #chip {
    position: absolute; left: 50%; bottom: 108px; transform: translateX(-50%);
    padding: 3px 11px; border-radius: var(--r-pill); z-index: 4; white-space: nowrap;
    background-color: var(--glass-base);
    background-image: var(--glass-fill), var(--glass-tint);
    -webkit-backdrop-filter: blur(18px) saturate(180%);
    backdrop-filter: blur(18px) saturate(180%);
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.26), inset 0 0 0 1px var(--hairline);
    color: var(--fg); font-size: 11px; letter-spacing: 0.4px;
    opacity: 0; transition: opacity 0.25s var(--ease); pointer-events: none;
    font-family: var(--mono);
  }
  #chip.show { opacity: 1; }
  #chip.hot { background-image: none; background-color: var(--danger); color: #fff; animation: flashRed 0.75s infinite; }
  #ring {
    position: absolute; left: 50%; bottom: 2px; width: 120px; height: 120px;
    margin-left: -60px; border-radius: 50%; z-index: 1; opacity: 0;
    background: radial-gradient(circle, rgba(124,196,127,0.45) 0%, rgba(124,196,127,0.0) 62%);
    transition: opacity 0.3s;
  }
  #ring.on { opacity: 1; animation: pulse 1.8s ease-in-out infinite; }
</style>
</head>
<body class="t0">
  <div id="ring"></div>
  <div id="bubble"></div>
  <div id="chip"></div>
  <div id="pet"></div>
  <script src="../src/shared/logic.js"></script>
  <script src="../src/shared/repeat.js"></script>
  <script src="../src/shared/task.js"></script>
  <script src="i18n.js"></script>
  <script src="audio.js"></script>
  <script src="pet.js"></script>
</body>
</html>
