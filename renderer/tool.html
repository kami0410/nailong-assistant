<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: file:; media-src 'self' file:; font-src 'self'; connect-src 'none'; form-action 'none'">
<title>奶蛙工具</title>
<link rel="stylesheet" href="ui.css">
<style>
  #tabs { margin: 8px 0 10px; }
  .disp { text-align: center; font-size: 38px; font-weight: 600; letter-spacing: 2px; font-family: var(--mono); line-height: 1.1; }
  .sub { text-align: center; font-size: 11px; color: var(--fg-dim); margin-top: 2px; min-height: 15px; }
  .chips { display: flex; gap: 5px; margin: 10px 0 8px; }
  .chips .chip { flex: 1; text-align: center; }
  .ring { position: relative; width: 150px; height: 150px; margin: 2px auto 6px; }
  .ring svg { transform: rotate(-90deg); }
  .ring .bgc { stroke: var(--chip); }
  .ring .fgc { stroke: var(--accent); transition: stroke-dashoffset 0.6s linear; }
  .ring .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .ring .center .t { font-size: 30px; font-weight: 600; font-family: var(--mono); }
  .ring .center .p { font-size: 11px; color: var(--fg-dim); }
  .note { margin-top: 8px; font-size: 10.5px; line-height: 1.5; color: var(--fg-dim); text-align: center; }
  #status { flex: none; margin-top: 8px; min-height: 16px; font-size: 11px; color: var(--fg-mid); text-align: center;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #dispCoin { text-align: center; font-size: 30px; font-weight: 600; line-height: 1.2; min-height: 62px;
    display: flex; align-items: center; justify-content: center; word-break: break-word; }
</style>
</head>
<body class="t0">
  <div class="card">
    <div class="tint"></div>
    <div class="content">
      <div class="topbar">
        <div class="label" data-i18n="tool.title">奶 蛙 工 具</div>
        <div class="icobtn" id="settingsbtn" title="设置">⚙</div>
        <div class="icobtn" id="close" title="收起">✕</div>
      </div>

      <div class="tabs" id="tabs">
        <div class="tab on" data-tab="focus">🍅 <span data-i18n="tool.tab.focus">专注</span></div>
        <div class="tab" data-tab="countdown">⏳ <span data-i18n="tool.tab.countdown">倒计时</span></div>
        <div class="tab" data-tab="alarm">⏰ <span data-i18n="tool.tab.alarm">闹钟</span></div>
        <div class="tab" data-tab="coin">🪙 <span data-i18n="tool.tab.coin">硬币</span></div>
      </div>

      <!-- 番茄钟 -->
      <div class="view on" id="v-focus">
        <div class="ring">
          <svg width="150" height="150">
            <circle class="bgc" cx="75" cy="75" r="66" fill="none" stroke-width="8"></circle>
            <circle class="fgc" id="ringFg" cx="75" cy="75" r="66" fill="none" stroke-width="8"
              stroke-linecap="round" stroke-dasharray="414.7" stroke-dashoffset="414.7"></circle>
          </svg>
          <div class="center">
            <div class="t" id="pomoTime">25:00</div>
            <div class="p" id="pomoPhase" data-i18n="tool.idle">待开始</div>
          </div>
        </div>
        <div class="chips">
          <div class="chip" data-min="15">15分</div>
          <div class="chip on" data-min="25">25分</div>
          <div class="chip" data-min="45">45分</div>
          <div class="chip" data-min="50">50分</div>
        </div>
        <div class="row">
          <div class="btn primary grow" id="pomoStart" data-i18n="tool.start">开始专注</div>
          <div class="btn sm" id="pomoPause" data-i18n="tool.pause">暂停</div>
          <div class="btn sm" id="pomoSkip" data-i18n="tool.skip">跳过</div>
          <div class="btn sm" id="pomoStop" data-i18n="tool.stop">停止</div>
        </div>
        <div class="sub" id="pomoStat"></div>
        <div class="note" data-i18n="tool.focusNote">专注结束奶蛙会叫你休息；到点自动进入短休/长休</div>
      </div>

      <!-- 倒计时 -->
      <div class="view" id="v-countdown">
        <div class="disp" id="disp">00:00</div>
        <div class="sub" id="cdSub"></div>
        <div class="chips">
          <div class="chip" data-cd="1">1分</div>
          <div class="chip" data-cd="3">3分</div>
          <div class="chip" data-cd="5">5分</div>
          <div class="chip on" data-cd="10">10分</div>
          <div class="chip" data-cd="25">25分</div>
        </div>
        <div class="row">
          <input class="grow" id="cdMin" type="number" min="1" max="600" data-i18n-ph="tool.minutes" placeholder="分钟">
          <div class="btn primary" id="cdGo" data-i18n="tool.cdStart">开始</div>
          <div class="btn" id="cdCancel" data-i18n="tool.cdCancel">取消</div>
        </div>
        <div class="note" data-i18n="tool.cdNote">到点时奶蛙会跳起来报时</div>
      </div>

      <!-- 闹钟 -->
      <div class="view" id="v-alarm">
        <div class="disp" id="dispAlarm">--:--</div>
        <div class="sub" id="alSub"></div>
        <div class="row" style="margin-top:12px">
          <select id="alH"></select>
          <select id="alM"></select>
        </div>
        <div class="row">
          <div class="btn primary" id="alGo" data-i18n="tool.alarmSet">设定闹钟</div>
          <div class="btn" id="alCancel" data-i18n="tool.cdCancel">取消</div>
        </div>
        <div class="note" data-i18n="tool.alarmNote">到点时奶蛙会响铃并跳起来，点它会停</div>
      </div>

      <!-- 硬币 -->
      <div class="view" id="v-coin">
        <div id="dispCoin" data-i18n="tool.coinAsk">抛一枚硬币？</div>
        <div class="row">
          <input id="coinA" data-i18n-ph="tool.coinA" placeholder="选项 A（可留空）">
          <input id="coinB" data-i18n-ph="tool.coinB" placeholder="选项 B（可留空）">
        </div>
        <div class="row">
          <div class="btn primary" id="coinGo">🪙 <span data-i18n="tool.coinGo">抛硬币</span></div>
        </div>
        <div class="note" data-i18n="tool.coinNote">留空则抛正/反；也可以直接点奶蛙来抛</div>
      </div>

      <div id="status"></div>
    </div>
  </div>
  <script src="i18n.js"></script>
  <script src="tool.js"></script>
</body>
</html>
