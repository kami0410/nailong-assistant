<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>奶蛙工具</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: transparent; cursor: default;
    font-family: "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
    color: #fff6e0; -webkit-user-select: none; user-select: none;
  }
  #card {
    position: absolute; left: 8px; top: 8px; right: 8px; bottom: 8px;
    border-radius: 24px; overflow: hidden; display: flex; flex-direction: column;
    background: rgba(96, 68, 20, 0.60);
    box-shadow: 0 16px 40px rgba(0,0,0,0.42), inset 0 1px 0 rgba(255,242,205,0.30);
    border: 1px solid rgba(255,238,195,0.26);
  }
  #tint { position: absolute; left: 0; top: 0; right: 0; bottom: 0;
    background: linear-gradient(180deg, rgba(196,148,38,0.30), rgba(112,78,16,0.48)); pointer-events: none; }
  #content { position: relative; padding: 10px 12px; display: flex; flex-direction: column; height: 100%; box-sizing: border-box; }

  #topbar { display: flex; align-items: center; height: 28px; -webkit-app-region: drag; flex: none; }
  #topbar .label { flex: 1; font-size: 11px; letter-spacing: 2px; color: rgba(255,225,165,0.8); }
  .icobtn { width: 22px; height: 22px; line-height: 22px; text-align: center; font-size: 12px;
    color: rgba(255,240,205,0.65); border-radius: 50%; cursor: pointer; -webkit-app-region: no-drag; }
  .icobtn:hover { color: #fff6e0; background: rgba(255,235,180,0.14); }

  #tabs { display: flex; gap: 6px; margin: 6px 0 8px; flex: none; }
  .tab { flex: 1; height: 30px; line-height: 30px; text-align: center; border-radius: 15px; cursor: pointer;
    font-size: 12px; color: rgba(255,240,205,0.75); background: rgba(255,235,180,0.12);
    border: 1px solid rgba(255,235,180,0.20); }
  .tab:hover { background: rgba(255,235,180,0.20); }
  .tab.on { background: rgba(246,199,88,0.92); color: #4a3a12; font-weight: 600; border-color: transparent; }

  .view { flex: 1; display: none; flex-direction: column; min-height: 0; }
  .view.on { display: flex; }

  #disp { text-align: center; font-size: 40px; font-weight: 600; letter-spacing: 2px;
    color: #fff6e0; text-shadow: 0 2px 10px rgba(0,0,0,0.35); line-height: 1.1; }
  #dispAlarm { text-align: center; font-size: 36px; font-weight: 600; letter-spacing: 2px;
    color: #fff6e0; text-shadow: 0 2px 10px rgba(0,0,0,0.35); line-height: 1.1; }
  #dispCoin { text-align: center; font-size: 34px; font-weight: 600; letter-spacing: 1px;
    color: #fff6e0; text-shadow: 0 2px 10px rgba(0,0,0,0.35); line-height: 1.18;
    word-break: break-word; overflow-wrap: anywhere; min-height: 44px; max-height: 112px;
    overflow: hidden; display: flex; align-items: center; justify-content: center; }

  .chips { display: flex; gap: 6px; margin: 10px 0 8px; }
  .chip { flex: 1; height: 28px; line-height: 28px; text-align: center; border-radius: 14px; cursor: pointer;
    font-size: 11.5px; color: rgba(255,240,205,0.85); background: rgba(255,235,180,0.13);
    border: 1px solid rgba(255,235,180,0.22); }
  .chip:hover { background: rgba(255,235,180,0.24); }
  .chip.on { background: rgba(246,199,88,0.92); color: #4a3a12; font-weight: 600; border-color: transparent; }

  .row { display: flex; gap: 8px; align-items: center; margin-top: 6px; }
  input, select {
    height: 32px; border: none; border-radius: 12px; outline: none; box-sizing: border-box;
    background: rgba(255,225,160,0.14); color: #fff6e0; font-size: 12.5px; padding: 0 10px;
    box-shadow: inset 0 1px 0 rgba(255,238,190,0.18);
  }
  .row input { flex: 1 1 0; min-width: 0; }
  input::placeholder { color: rgba(255,240,205,0.35); }
  input.num { flex: 0 0 66px; width: 66px; text-align: center; }
  select { flex: 1 1 0; min-width: 0; cursor: pointer; }
  option { background: #5a431a; color: #fff6e0; }
  .btn { flex: 1; height: 34px; line-height: 34px; text-align: center; border-radius: 17px; cursor: pointer;
    font-size: 13px; font-weight: 600; }
  .btn.go { background: rgba(246,199,88,0.92); color: #4a3a12; }
  .btn.go:hover { background: rgba(252,212,110,1); }
  .btn.cancel { background: rgba(255,235,180,0.14); color: rgba(255,240,205,0.85); }
  .btn.cancel:hover { background: rgba(255,235,180,0.24); }

  #status { flex: none; margin-top: 8px; min-height: 16px; font-size: 11px; color: rgba(255,240,205,0.7); text-align: center;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .note { margin-top: 6px; font-size: 10.5px; line-height: 1.5; color: rgba(255,240,205,0.5); text-align: center; }
</style>
</head>
<body>
  <div id="card">
    <div id="tint"></div>
    <div id="content">
      <div id="topbar">
        <div class="label">奶 蛙 工 具</div>
        <div class="icobtn" id="close" title="收起（右键奶蛙可再次唤出）">✕</div>
      </div>

      <div id="tabs">
        <div class="tab" data-tab="countdown">⏳ 倒计时</div>
        <div class="tab" data-tab="alarm">⏰ 闹钟</div>
        <div class="tab" data-tab="coin">🪙 抛硬币</div>
      </div>

      <div class="view" id="v-countdown">
        <div id="disp">00:00</div>
        <div class="chips">
          <div class="chip" data-min="1">1分</div>
          <div class="chip" data-min="3">3分</div>
          <div class="chip" data-min="5">5分</div>
          <div class="chip" data-min="10">10分</div>
          <div class="chip" data-min="25">25分</div>
        </div>
        <div class="row">
          <input class="num" id="cdMin" type="number" min="1" max="600" placeholder="分钟">
          <div class="btn go" id="cdGo">开始</div>
          <div class="btn cancel" id="cdCancel">取消</div>
        </div>
        <div class="note">到点时奶蛙会跳起来报时</div>
      </div>

      <div class="view" id="v-alarm">
        <div id="dispAlarm">--:--</div>
        <div class="row">
          <select id="alH"></select>
          <select id="alM"></select>
        </div>
        <div class="row">
          <div class="btn go" id="alGo">设定闹钟</div>
          <div class="btn cancel" id="alCancel">取消</div>
        </div>
        <div class="note">到点时奶蛙会响铃并跳起来</div>
      </div>

      <div class="view" id="v-coin">
        <div id="dispCoin">抛一枚硬币？</div>
        <div class="row">
          <input id="coinA" placeholder="选项 A（可留空）">
          <input id="coinB" placeholder="选项 B（可留空）">
        </div>
        <div class="row">
          <div class="btn go" id="coinGo">🪙 抛硬币</div>
        </div>
        <div class="note">留空则抛正 / 反；也可以直接点奶蛙来抛</div>
      </div>

      <div id="status"></div>
    </div>
  </div>
  <script src="tool.js"></script>
</body>
</html>
