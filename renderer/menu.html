<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: file:; media-src 'self' file:; font-src 'self'; connect-src 'none'; form-action 'none'">
<title>奶蛙形态</title>
<link rel="stylesheet" href="ui.css">
<style>
  .item {
    display: flex; align-items: center; gap: 9px; padding: 8px 10px; border-radius: 12px;
    cursor: pointer; font-size: 12.5px; margin-bottom: 3px;
  }
  .item:hover { background: var(--hover); }
  .item.cur { background: var(--chip); }
  .item .ico { width: 20px; text-align: center; font-size: 14px; }
  .item .nm { flex: 1; }
  .item .ck { font-size: 10px; color: var(--accent); }
  .sep { height: 1px; background: var(--chip-br); margin: 7px 4px; }
  .item.quit:hover { background: var(--danger); color: #fff; }
</style>
</head>
<body class="t0">
  <div class="card">
    <div class="tint"></div>
    <div class="content" style="padding:8px">
      <div class="topbar" style="padding:0 4px">
        <div class="label" style="margin-left:0" data-i18n="menu.title">奶 蛙 形 态</div>
      </div>
      <div class="scroll" style="margin-top:6px">
        <div class="item" data-mode="normal"><img class="brand-icon" src="../assets/naifrog/icon.png" alt=""><span class="nm" data-i18n="menu.pet">普通奶蛙</span><span class="ck"></span></div>
        <div class="item" data-mode="assistant"><img class="brand-icon" src="../assets/naifrog/icon.png" alt=""><span class="nm" data-i18n="menu.assistant">奶蛙助手</span><span class="ck"></span></div>
        <div class="sep"></div>
        <div class="item" data-mode="focus"><span class="ico">🍅</span><span class="nm" data-i18n="menu.focus">番茄钟</span><span class="ck"></span></div>
        <div class="item" data-mode="countdown"><span class="ico">⏳</span><span class="nm" data-i18n="menu.countdown">倒计时</span><span class="ck"></span></div>
        <div class="item" data-mode="alarm"><span class="ico">⏰</span><span class="nm" data-i18n="menu.alarm">闹钟</span><span class="ck"></span></div>
        <div class="item" data-mode="coin"><span class="ico">🪙</span><span class="nm" data-i18n="menu.coin">抛硬币</span><span class="ck"></span></div>
        <div class="item" data-mode="catch"><span class="ico">🏃</span><span class="nm" data-i18n="menu.catch">抓奶蛙</span><span class="ck"></span></div>
        <div class="sep"></div>
        <div class="item" id="mi-settings"><span class="ico">⚙</span><span class="nm" data-i18n="menu.settings">设置…</span></div>
        <div class="item" id="mi-panel"><span class="ico">📅</span><span class="nm" data-i18n="menu.panel">打开日程面板</span></div>
        <div class="item quit" id="mi-quit"><span class="ico">⏻</span><span class="nm" data-i18n="menu.quit">退出奶蛙</span></div>
      </div>
    </div>
  </div>
  <script src="i18n.js"></script>
  <script src="menu.js"></script>
</body>
</html>
